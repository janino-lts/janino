# Logging for "capture.sh": Spark logs every class body that it compiles through the logger of its CodeGenerator
# (at the level "spark.sql.codegen.logLevel", DEBUG); these messages go to the file "work/codegen.log" (or the
# file named by the system property "spark.corpus.log"), each preceded by a marker line, so that "CaptureTpcds"
# can split the file into events. Everything else goes to the console, warnings and errors only.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

appender.codegen.type = File
appender.codegen.name = codegen
appender.codegen.fileName = ${sys:spark.corpus.log:-work/codegen.log}
appender.codegen.append = false
appender.codegen.layout.type = PatternLayout
appender.codegen.layout.pattern = @@EVENT@@%n%m%n

logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen.CodeGenerator
logger.codegen.level = debug
logger.codegen.additivity = false
logger.codegen.appenderRef.codegen.ref = codegen
