# Analyzes the code with CodeQL (GitHub code scanning). The results are shown under "Security" > "Code scanning".
#
# This is an "advanced setup" of code scanning, because the POM is not in the root directory of the repository; if
# the "default setup" is enabled in "Settings" > "Code security", then it must be disabled.
#
# The workflow runs for pull requests, for pushes to "master", once a week, and when started manually ("Actions" >
# "CodeQL" > "Run workflow"). It is NOT a required status check.

name: CodeQL

on:
  pull_request:
  push:
    branches: [ master ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: mvn -B -f janino-parent/pom.xml -DskipTests install

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
