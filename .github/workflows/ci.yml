# Builds JANINO and runs all tests.
#
# The code is compiled with JDK 25 (for Java 8, see "maven.compiler.release" in "janino-parent/pom.xml"), and the
# tests are executed on Java 8, 17, 21 and 25 (through surefire's "jvm" parameter). A separate job compiles the code
# that Apache Spark generated for twelve TPC-DS queries (the corpus of "janino-benchmarks") in both modes of JANINO,
# and another one compiles and runs the programs of regression tests of the Eclipse compiler ("JdtCorpusTest").
#
# The workflow runs
#  * for pull requests, before they are merged: when a pull request is opened or reopened, and when new commits are
#    pushed to it (it then tests the result of merging the pull request into its base branch), and
#  * when started manually ("Actions" > "CI" > "Run workflow", for any branch).
# It does NOT run on plain pushes.
#
# To make a successful run a precondition for merging, add the four "Build with JDK 25, test on Java ..." checks as
# required status checks of the base branch ("Settings" > "Branches" or "Rules"; available for public repositories,
# and for private repositories with a plan that supports branch protection).

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# When new commits are pushed to a pull request, cancel the runs for its previous commits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with JDK 25, test on Java ${{ matrix.test-java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [ 8, 17, 21, 25 ]

    steps:
      - uses: actions/checkout@v7

      # The JDK that executes the tests.
      - name: Set up Java ${{ matrix.test-java }} for the tests
        id: test-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}

      # The JDK that runs MAVEN and compiles the code; set up last, so that it becomes JAVA_HOME.
      - name: Set up JDK 25 for the build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn -B -f janino-parent/pom.xml install "-Djvm=${{ steps.test-java.outputs.path }}/bin/java"

  # Compiles the code that Apache Spark generated for twelve TPC-DS queries, the corpus of the benchmarks, with the
  # JANINO of this commit in the compatibility mode and in the compliance mode, and loads and instantiates every
  # generated class ("SparkCorpusTest" in "janino-benchmarks"). The module is not part of the normal build (profile
  # "benchmarks" of "janino-parent"), and its tests need the Spark runtime (about 250 MB), which is cached under a
  # key of its own, so that it is not downloaded in every run.
  spark-corpus:
    name: Spark corpus in both modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: janino-benchmarks/pom.xml

      # The benchmarks resolve JANINO from the local Maven repository; the tests run in the matrix above.
      - name: Build and install JANINO
        run: mvn -B -f janino-parent/pom.xml install -DskipTests

      - name: Compile the corpus in both modes
        run: mvn -B -f janino-benchmarks/pom.xml test

  # Compiles and runs the programs of regression tests of the Eclipse compiler (ECJ) with JANINO in both modes and
  # with JAVAC, and compares the results with the differences recorded in
  # "commons-compiler-tests/src/test/resources/jdtCorpus" ("JdtCorpusTest"). The programs are not part of this
  # repository (Eclipse Public License 2.0): the job checks out the test classes "JDT_CLASSES" of
  # "eclipse-jdt/eclipse.jdt.core" at the tag "JDT_TAG" (which "JdtCorpusTest.JDT_TAG" names, too), and
  # ".github/jdt/JdtCorpusExtractor.java" extracts the programs from them.
  jdt-corpus:
    name: JDT corpus in both modes
    runs-on: ubuntu-latest
    env:
      JDT_TAG: R4_41
      JDT_TESTS: org.eclipse.jdt.core.tests.compiler/src/org/eclipse/jdt/core/tests/compiler/regression
      JDT_CLASSES: >-
        VarargsTest AssertionTest AutoBoxingTest ConditionalExpressionTest ConstantTest InnerEmulationTest LookupTest
        Compliance_1_4
    steps:
      - uses: actions/checkout@v7

      - name: Check out the regression tests of the Eclipse compiler
        uses: actions/checkout@v7
        with:
          repository: eclipse-jdt/eclipse.jdt.core
          ref: ${{ env.JDT_TAG }}
          path: eclipse.jdt.core
          sparse-checkout: ${{ env.JDT_TESTS }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Extract the programs
        run: >-
          java .github/jdt/JdtCorpusExtractor.java "eclipse.jdt.core/$JDT_TESTS" "$RUNNER_TEMP/jdt-corpus"
          $JDT_CLASSES

      # The tests run in the matrix above.
      - name: Build JANINO
        run: mvn -B -f janino-parent/pom.xml install -DskipTests

      - name: Compile and run the programs in both modes
        run: >-
          mvn -B -f janino-parent/pom.xml test -pl :commons-compiler-tests -Dtest=JdtCorpusTest
          -Dsurefire.failIfNoSpecifiedTests=false "-Djdt.corpus=$RUNNER_TEMP/jdt-corpus"
