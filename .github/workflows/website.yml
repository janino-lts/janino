# Builds the project website (the files under "site/", plus the aggregated JAVADOC) and publishes it on GitHub Pages.
#
# The pages under "site/" come from the branch that the workflow runs on (normally the default branch, whose change
# log covers all releases and the development line). The JAVADOC comes from the latest release, i.e. the highest tag
# "v3.1.*", so that it documents the API of the artifacts on Maven Central; the input "release" selects another tag.
#
# The workflow only runs when started manually ("Actions" > "Website" > "Run workflow"); it is never triggered
# automatically.
#
# Before the first run:
#  * The repository must be public (or the account must have a plan that supports GitHub Pages for private
#    repositories; the published site is public in any case).
#  * "Settings" > "Pages" > "Build and deployment" > "Source" must be set to "GitHub Actions".
#
# Notice: GitHub creates an environment "github-pages", which, by default, allows deployments only from the default
# branch. If the default branch changes, or if this workflow is ever triggered by a release (i.e. by a tag), adjust
# "Settings" > "Environments" > "github-pages" > "Deployment branches and tags" accordingly. (Checking out a tag for
# the JAVADOC, as below, does not count as a deployment from that tag.)
#
# Links from the website into the repository use "blob/HEAD/..." and "tree/HEAD/...", which always refer to the
# default branch.

name: Website

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag for the JAVADOC, e.g. "v3.1.19" (empty: the highest tag "v3.1.*")'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # The pages under "site/"; the complete history, for the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine the release
        id: release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          tag="$RELEASE"
          [ -n "$tag" ] || tag=$(git tag --list 'v3.1.*' --sort=-v:refname | head -1)
          git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || { echo "No such tag: \"$tag\""; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "JAVADOC from $tag"

      # The sources of the release, for the JAVADOC.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Builds the JAVADOC of the release in "release/janino-parent/target/website/apidocs"; see profile "website" in
      # "janino-parent/pom.xml".
      - name: Build the JAVADOC of the release
        run: mvn -B -f release/janino-parent/pom.xml -P website

      - name: Assemble the website
        run: |
          mkdir -p target/website
          cp -r site/. target/website/
          cp -r release/janino-parent/target/website/apidocs target/website/apidocs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
